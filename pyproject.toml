[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsearch"
version = "0.1.0"
description = "Поиск по архиву документов на сетевой папке"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "PyMuPDF>=1.24.0",
    "pymorphy3>=2.0.1",
    "pymorphy3-dicts-ru>=2.4.417150",
    "striprtf>=0.0.26",
    "extract-msg>=0.48.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docsearch = "docsearch.cli:main"

[tool.setuptools.packages.find]
include = ["docsearch*"]
